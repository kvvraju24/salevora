name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Capture portfolio screenshots
        type: boolean
        default: false

jobs:
  backend:
    name: API tests (deployment snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - name: Install serving dependencies
        run: python -m pip install -r backend/requirements-runtime.txt httpx==0.28.1 pytest==9.1.1
      # The full reconciliation suite needs the original Kaggle archive, which is not
      # redistributed. CI runs every check that works from the committed snapshot.
      - name: Run snapshot tests
        run: python -m pytest tests/test_runtime.py -q -k "not preserves_dashboard_results"

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SALEVORA_DATA_MODE: snapshot
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-runtime.txt
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Start production server
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Run browser tests
        working-directory: frontend
        run: npx playwright test platform.spec.ts
      - name: Capture screenshots
        if: ${{ inputs.screenshots }}
        working-directory: frontend
        env:
          SCREENSHOTS: '1'
        run: npx playwright test screenshots.spec.ts
      - name: Publish screenshots to the screenshots branch
        if: ${{ inputs.screenshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898293+github-actions[bot]@users.noreply.github.com"
          git checkout -b screenshots
          git add -f docs/screenshots
          git commit -m "Capture portfolio screenshots"
          git push -f origin screenshots
      - name: Server log
        if: failure()
        run: cat server.log
