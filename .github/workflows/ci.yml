name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API tests (deployment snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - name: Install serving dependencies
        run: python -m pip install -r backend/requirements-runtime.txt httpx==0.28.1 pytest==9.1.1
      # The full reconciliation suite needs the original Kaggle archive, which is not
      # redistributed. CI runs every check that works from the committed snapshot.
      - name: Run snapshot tests
        run: python -m pytest tests/test_runtime.py -q -k "not preserves_dashboard_results"

  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
